# Mac Ambient Screen Sync Configuration
home_assistant:
  url: "http://192.168.X.X:8123"
  token: "INSERT_YOUR_LONG_LIVED_TOKEN_HERE"
  entity_id: "light.your_rgb_lamp"   # e.g., light.living_room_lamp
  timeout: 1.0

capture:
  monitor_index: 1          # 1 = primary built-in Mac monitor
  fps: 4                    # 3-5 updates per second (optimal for Wi-Fi/Zigbee)
  sample_width: 64          # Downscaling for CPU < 1%
  sample_height: 36
  ignore_black_bars: true   # Removes horizontal black bars from movies
  black_threshold: 18       # Threshold below which a pixel is considered black

color_processing:
  saturation_boost: 1.35    # Boost vivid colors (avoids gray/dull lights)
  brightness_boost: 1.10
  min_brightness: 25        # Minimum brightness (won't turn off in total darkness)
  max_brightness: 255
  smoothing_factor: 0.35    # 0.2 = smooth transitions, 0.8 = fast changes
  change_threshold: 10      # Minimum color difference to prevent spamming Home Assistant
  transition_time: 0.3      # Seconds of smooth transition in Home Assistant
